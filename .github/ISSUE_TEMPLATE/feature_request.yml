name: ✨ Feature Request
description: Propose a new feature, idea, or UI enhancement for URLoader
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make URLoader even better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a specific limitation or pain point?
      placeholder: "e.g., I find it difficult to..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the feature, workflow, or design improvement you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
