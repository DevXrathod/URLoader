name: 🐛 Bug Report
description: File a bug report to help us improve URLoader
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify you are using the latest version of URLoader before submitting.

  - type: input
    id: app-version
    attributes:
      label: URLoader Version
      description: What version of URLoader are you running? (Check Settings or APK release)
      placeholder: "e.g., 1.0.0"
    validations:
      required: true

  - type: input
    id: device-info
    attributes:
      label: Device & Android Version
      description: What device and Android OS version are you using?
      placeholder: "e.g., Google Pixel 8 Pro - Android 16 (API 36)"
    validations:
      required: true

  - type: input
    id: url-source
    attributes:
      label: Source URL / Platform
      description: The platform or sample URL that caused the failure (if applicable).
      placeholder: "e.g., YouTube Shorts, Instagram Reel, X post"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open YouTube
        2. Tap Share -> URLoader
        3. Tap Download Video
        4. See error notification
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logcat / Error Output
      description: Please paste any relevant stack traces or Logcat output.
      render: shell
    validations:
      required: false
